name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Profile Statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: alextaf2017
          filename: github-stats.svg
          output_action: commit
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Rome

      - name: Generate Most Used Programming Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: alextaf2017
          filename: github-languages.svg
          output_action: commit
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugins_errors_fatal: yes
          debug: yes

      - name: Generate GitHub Contribution Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: alextaf2017
          filename: github-contributions.svg
          output_action: commit
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
